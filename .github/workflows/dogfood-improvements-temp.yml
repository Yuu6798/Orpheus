name: Dogfood Improvements Temp

on:
  push:
    branches: [codex/capability-dogfood-improvements]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          corepack enable
          uv sync --locked --extra analysis --extra fx --extra model3d
          pnpm install --frozen-lockfile
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Ensure Chrome Headless Shell
        run: pnpm exec remotion browser ensure
      - name: Focused tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_capability_catalog.py \
            tests/test_capability_runtime_effects.py \
            tests/test_capability_validation.py \
            tests/test_capability_boundary.py \
            tests/test_capability_dogfood_improvements.py \
            tests/test_pipeline.py \
            tests/test_workflow_example.py
      - name: Catalog-driven starter dogfood
        run: |
          set -euo pipefail
          uv run --no-sync orpheus validate > "$RUNNER_TEMP/catalog-validation.json"
          uv run --no-sync orpheus schema catalog > "$RUNNER_TEMP/catalog-schema.json"
          uv run --no-sync orpheus show workflow.lyric_mv > "$RUNNER_TEMP/workflow.json"
          uv run --no-sync orpheus show mv.render > "$RUNNER_TEMP/render.json"
          uv run --no-sync python - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          workflow = json.load(open(root / "workflow.json", encoding="utf-8"))["result"]
          render = json.load(open(root / "render.json", encoding="utf-8"))["result"]
          assert workflow["starters"][0]["commands"][0] == ["uv", "run", "python", "examples/workflow/run.py", "PROJECT_DIR"]
          assert workflow["parameter_readiness"]["required"]["machine_readable_complete"] is True
          tools = {row["name"]: row for row in render["requires"]["tool_requirements"]}
          assert render["requires"]["network"]["mode"] == "environment-dependent"
          assert tools["ffmpeg"]["required_on_path"] is False
          assert tools["ffprobe"]["required_on_path"] is False
          PY
          uv run --no-sync python examples/workflow/run.py "$RUNNER_TEMP/starter-mv" > "$RUNNER_TEMP/result.json"
          uv run --no-sync python - "$RUNNER_TEMP/starter-mv" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          result = json.load(open(root / "work/example/result.json", encoding="utf-8"))
          verification = json.load(open(result["initial_verification"], encoding="utf-8"))
          assert result["workflow"] == "complete"
          assert verification["technical_pass"] is True
          assert verification["current_inputs_match"] is True
          assert verification["verification_stage"] == "render"
          assert set(verification["current_input_hashes"]) == {"analysis", "storyboard", "assets"}
          print(json.dumps({"workflow": result["workflow"], "video": result["video"],
                            "verification_stage": verification["verification_stage"]}, ensure_ascii=False))
          PY
