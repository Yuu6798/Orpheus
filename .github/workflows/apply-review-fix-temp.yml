name: Apply Review Fix Temp

on:
  push:
    branches: [codex/capability-dogfood-improvements]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply reviewed fixes
        run: |
          set -euo pipefail
          cat .github/review-fix-temp/part* > /tmp/review-fix.b64
          base64 --decode /tmp/review-fix.b64 | gzip -dc > /tmp/review-fix.patch
          git apply --check /tmp/review-fix.patch
          git apply /tmp/review-fix.patch
          rm -rf .github/review-fix-temp
          rm -f .github/workflows/apply-review-fix-temp.yml
          git config user.name "Yuu6798"
          git config user.email "kkoo6798@gmail.com"
          git add -A
          git commit -m "fix(tooling): make starter and tool resolution exact"
          git push origin HEAD:codex/capability-dogfood-improvements
