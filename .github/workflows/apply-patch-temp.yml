name: Apply Patch Temp

on:
  push:
    branches: [codex/capability-dogfood-improvements]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          set -euo pipefail
          cat .github/patches-temp/part* > /tmp/patch.b64
          base64 --decode /tmp/patch.b64 | gzip -dc > /tmp/changes.patch
          git apply --check /tmp/changes.patch
          git apply /tmp/changes.patch
          rm -rf .github/patches-temp
          rm -f .github/workflows/apply-patch-temp.yml
          git config user.name "Yuu6798"
          git config user.email "kkoo6798@gmail.com"
          git add -A
          git commit -m "feat(tooling): connect catalog starters, schemas, tools, and verification"
          git push origin HEAD:codex/capability-dogfood-improvements
