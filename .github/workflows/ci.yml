# 方針: 最小権限・action は commit SHA 固定（版コメント付き）・--locked / --frozen-lockfile・
# concurrency・timeout。成果物（MP4 等）はアップロードしない。
# CI の smoke は構造検査（technical_pass）であり、作品採用や実曲の同期精度の保証ではない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Dependabot は action の SHA/タグのみ更新するため、uv 本体の版は本変数で手動更新する。
  # pyproject.toml の [tool.uv] required-version と揃える。
  # uv < 0.13.4 は emSign ECC Root CA - G3 を含む CA bundle を同梱する (GHSA-hq85-5cpj-mr62)。
  UV_VERSION: "0.13.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # README が宣言する Python 3.11〜3.13 の両端を検証する (pytest は Chrome/librosa 不要)。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      # setup-python が PATH に置いた matrix 版を uv に使わせ、別版の黙示取得を禁止する。
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      # --locked: uv.lock が pyproject.toml と食い違えば更新せず失敗する。dev group (pytest) は既定で入る。
      # fx extra (opencv-python-headless) は fx のテストを skip させないために入れる。
      # 既存コマンドが cv2 なしで動くことは、fx 側が cv2 を遅延 import する構造とテストの importorskip で守る。
      # model3d extra (tools/model3d のパス依存) も同じ理由で入れる (無いと tools/model3d/tests は importorskip で skip される)。
      - name: Install (locked)
        run: uv sync --locked --extra fx --extra model3d

      # lint は ruff 設定の導入 (別 PR) 後に追加する。
      - name: Test
        run: uv run --no-sync pytest -q --tb=short

      # fx (実験的な演出エンジン) の一気通貫: 合成素材 -> 4 版 + グリッド -> technical_pass。
      # technical_pass は構造検査 (復号・寸法・fps・フレーム数・色タグ・音声の尺) であり、見た目の合否ではない。
      # 検査は ffmpeg だけで行うので ffprobe は要らない (ffmpeg は PATH 上のもの、無ければ imageio-ffmpeg 同梱版)。
      - name: fx smoke (demo -> render -> technical_pass)
        run: |
          uv run --no-sync mv fx demo "$RUNNER_TEMP/fxdemo" --width 320 --height 180 --duration 2
          uv run --no-sync mv fx render "$RUNNER_TEMP/fxdemo/spec.json" --out "$RUNNER_TEMP/fxruns" > "$RUNNER_TEMP/fx-render.json"
          cat "$RUNNER_TEMP/fx-render.json"
          uv run --no-sync python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['status'] == 'succeeded' and r['technical_pass'] is True and r['grid'], r" "$RUNNER_TEMP/fx-render.json"
      # fx-timeline: 合成の 3 ショットを cut 以外のつなぎ (black / xfade / flash) で 1 本に -> technical_pass。
      - name: fx timeline smoke (demo -> render -> technical_pass)
        run: |
          uv run --no-sync mv fx timeline demo "$RUNNER_TEMP/fxtimeline" --duration 3
          uv run --no-sync mv fx timeline render "$RUNNER_TEMP/fxtimeline/timeline.json" --out "$RUNNER_TEMP/fxtimelineruns" --quiet > "$RUNNER_TEMP/fx-timeline.json"
          cat "$RUNNER_TEMP/fx-timeline.json"
          uv run --no-sync python -c "import json, sys; r = json.load(open(sys.argv[1], encoding='utf-8')); assert r['status'] == 'succeeded' and r['technical_pass'] is True, r" "$RUNNER_TEMP/fx-timeline.json"
      - name: dance smoke (demo -> render -> technical_pass)
        run: |
          uv run --no-sync mv dance demo "$RUNNER_TEMP/dancedemo" --width 180 --height 320 --duration 2
          uv run --no-sync mv dance render "$RUNNER_TEMP/dancedemo/spec.json" --out "$RUNNER_TEMP/danceruns" > "$RUNNER_TEMP/dance-render.json"
          cat "$RUNNER_TEMP/dance-render.json"
          uv run --no-sync python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['status'] == 'succeeded' and r['technical_pass'] is True, r" "$RUNNER_TEMP/dance-render.json"

      # gate (書き出し前の検査) の一気通貫: 正解の分かっている合成素材 -> 行・秒の確認表 -> 検査 -> expected.json と照合。
      # 声の代役は倍音だけの合成音で、実曲の歌い出しの推定精度ではない。check は既定のずらしで不合格（終了コード 1）が正解。
      - name: gate smoke (demo -> lines -> check -> expected)
        run: |
          uv run --no-sync mv gate demo "$RUNNER_TEMP/gatedemo"
          uv run --no-sync mv gate lines "$RUNNER_TEMP/gatedemo/lyrics.lrc" "$RUNNER_TEMP/gatedemo/lines" --vocals "$RUNNER_TEMP/gatedemo/vocals.wav"
          code=0; uv run --no-sync mv gate check "$RUNNER_TEMP/gatedemo/gate.json" > "$RUNNER_TEMP/gate-check.json" || code=$?
          cat "$RUNNER_TEMP/gate-check.json"
          uv run --no-sync python - "$RUNNER_TEMP/gatedemo" "$code" <<'PY'
          import json, sys
          root, code = sys.argv[1], int(sys.argv[2])
          expected = json.load(open(root + "/expected.json"))
          report = json.load(open(root + "/gate_report/gate_report.json"))
          by_name = {c["check"]: c for c in report["checks"]}
          measured = json.load(open(root + "/lines/lines_measured.json"))
          assert len(measured) == len(expected["lines"]), (len(measured), len(expected["lines"]))
          for row, found in zip(expected["lines"], measured):
              assert found["method"] == "vocals_onset" and abs(found["start"] - row["true_onset"]) <= expected["measure_tolerance_s"], (row, found)
          for name, status in expected["checks"].items():
              assert status == "uncertain" or by_name[name]["status"] == status, (name, by_name[name])
          assert [p["text"] for p in by_name["歌詞の時刻"]["problems"]] == expected["failing_lines"], by_name["歌詞の時刻"]
          assert [p["t"] for p in by_name["拍"]["problems"]] == expected["failing_flashes"], by_name["拍"]
          assert report["overall"] == expected["overall"] and code == expected["exit_code"], (report["overall"], code, expected["overall"])
          PY

      # inspect (生成動画の検品) の一気通貫: 合成素材 (異常を 7 か所に入れた緑背景の人物と設定画) -> 検品 -> 入れたコマと分類で見つかる。
      # 合成素材で働くことの確かめで、実作品での見落とし・誤検出の少なさや作品の採否ではない。VLM は代役 (画像を読まず、送信しない) だけを呼ぶ。
      - name: inspect smoke (demo -> check -> injected anomalies found)
        run: |
          uv run --no-sync mv inspect demo "$RUNNER_TEMP/inspectdemo"
          uv run --no-sync python -c "import json, sys; json.dump({'tool': 'vlm-standin', 'version': '0.1', 'sends_data': False, 'argv': [sys.executable, sys.argv[2], '--request', '{request}', '--output', '{output}', '--echo-events', 'other']}, open(sys.argv[1], 'w'))" "$RUNNER_TEMP/vlm-standin.json" "$GITHUB_WORKSPACE/scripts/vlm_standin.py"
          uv run --no-sync mv inspect check "$RUNNER_TEMP/inspectdemo/inspect.json" --vlm "$RUNNER_TEMP/vlm-standin.json" --quiet > "$RUNNER_TEMP/inspect.json"
          cat "$RUNNER_TEMP/inspect.json"
          uv run --no-sync python - "$RUNNER_TEMP/inspectdemo" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1] + "/inspect_report/inspect_report.json"))
          expected = json.load(open(sys.argv[1] + "/expected.json"))
          events = [e for e in report["events"] if e["evidence"] != "estimated"]   # 代役の VLM だけの出来事は数えない
          for anomaly in expected["anomalies"]:
              hits = [e for e in events if min(e["frames"][1], anomaly["frames"][1]) > max(e["frames"][0], anomaly["frames"][0])]
              assert len(hits) == 1 and hits[0]["category"] == anomaly["category"], (anomaly, hits)
          assert len(events) == len(expected["anomalies"]) and report["vlm"]["status"] == "run", report["summary"]
          assert any(e["evidence"] == "measured+estimated" for e in events), "代役の指摘が短い出来事に添えられていません"
          PY

      # model3d (自作 3D ツール) の一気通貫: 合成素材 -> 押し出し・結合・貫通の補正・検査・OBJ -> run の status。
      # status は構造と数値の検査であり、見た目の採否や実キャラの資産での成立ではない。Blender や生成器は呼ばない。
      - name: model3d smoke (demo -> run -> succeeded)
        run: |
          uv run --no-sync model3d demo "$RUNNER_TEMP/model3d-demo"
          uv run --no-sync model3d run "$RUNNER_TEMP/model3d-demo/recipe.json" --out "$RUNNER_TEMP/model3d-runs" --quiet > "$RUNNER_TEMP/model3d-run.json"
          cat "$RUNNER_TEMP/model3d-run.json"
          uv run --no-sync python -c "import json, sys; r = json.load(open(sys.argv[1])); s = r['steps']; assert r['status'] == 'succeeded' and s['before']['observations'][0]['inside'] == 15 and s['after']['observations'][0]['inside'] == 0 and s['structure']['observations'][0]['pass'] is True, r" "$RUNNER_TEMP/model3d-run.json"

      # 設定画 -> 初期モデル: 前処理 (自作) -> 代役の生成器 (別プロセス。輪郭の箱で、生成ではない) -> 検査 -> 記録。
      # 生成の工程は契約として常に needs_review なので、run の status も needs_review が正常。本物の生成器 (TripoSR) は CI で動かさない。
      - name: model3d generate smoke (sheet -> stand-in backend -> needs_review)
        run: |
          uv run --no-sync model3d run "$RUNNER_TEMP/model3d-demo/recipe_generate.json" --out "$RUNNER_TEMP/model3d-runs" --quiet > "$RUNNER_TEMP/model3d-generate.json"
          cat "$RUNNER_TEMP/model3d-generate.json"
          uv run --no-sync python -c "import json, sys; r = json.load(open(sys.argv[1])); s = r['steps']; o = s['generate']['observations'][0]; assert r['status'] == 'needs_review' and r['candidates'] == ['generate'] and o['vertex_colors'] is True and o['closed'] is True and s['inspect']['status'] == 'succeeded', r" "$RUNNER_TEMP/model3d-generate.json"
          uv run --no-sync model3d validate initial-model "$(uv run --no-sync python -c "import json, sys; print(json.load(open(sys.argv[1]))['steps']['generate']['artifacts']['record'])" "$RUNNER_TEMP/model3d-generate.json")"

  node:
    # README が宣言する Node.js 22 以上の下端のみ検証する (Remotion は保守凍結)。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # package.json の packageManager (pnpm) を corepack に解決させる。third-party action を増やさない。
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 残る指摘は zod (Remotion が版を固定する推移依存。docs/dependencies.md)。
      # Remotion 更新まで blocking にはせず、警告に留める。
      - name: pnpm audit (report-only)
        run: pnpm audit --prod --audit-level=high || echo "::warning::pnpm audit reported advisories (report-only)"

  render-smoke:
    # 合成素材 (mv demo) で Python -> Remotion -> MP4 -> verify の一気通貫を実描画する。
    # 画素/フォント一致は検証しない (technical_pass = 構造検査のみ)。
    # 初回 runner で Chrome Headless Shell が起動するか未確認のため、結果は失敗しても CI 全体を落とさない。
    needs: [python, node]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      UV_PYTHON: '3.12'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install Python (locked)
        run: uv sync --locked --extra analysis

      - name: Install Node (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Chrome Headless Shell は Remotion が node_modules/.remotion に取得する。
      # 版は @remotion/renderer に内蔵なので pnpm-lock.yaml をキーにする。
      # pnpm install の後に復元する (install が node_modules を再構成しても壊されないように)。
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 命中時は no-op、未命中時のみ取得する。render.mjs は ORPHEUS_BROWSER 未設定なら
      # 自動取得するので、ここで取得を独立ステップに切り出す。
      - name: Ensure Chrome Headless Shell
        run: pnpm exec remotion browser ensure

      - name: Demo -> render -> verify
        run: |
          uv run --no-sync mv demo "$RUNNER_TEMP/demo"
          uv run --no-sync mv render "$RUNNER_TEMP/demo"
          uv run --no-sync mv verify "$RUNNER_TEMP/demo"

      # 合成音源の実解析 -> 仮の歌詞時刻 -> 確認用 fixture -> 演出 -> 描画 -> 用途別の完了確認。
      # 実歌唱の同期精度・人間による作品採用を保証しない。入力と動画は runner の一時領域だけに置く。
      - name: Workflow example (audio + lyrics -> plan -> render -> completion)
        run: uv run --no-sync python examples/workflow/run.py "$RUNNER_TEMP/workflow-example"

  dependency-audit:
    # uv.lock の固定版を export した requirements (全 extras + 全 group) を pip-audit で照合する。
    # lock には Python 版による fork があり得るため両端の版で回す。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      # pip-audit は [dependency-groups] audit (uv.lock 管理) で固定する。プロジェクト本体は入れない。
      - name: Install pip-audit (locked)
        run: uv sync --locked --only-group audit --no-install-project

      # --no-emit-local: tools/model3d (パス依存) は PyPI に無いので除く。その依存 (numpy・jsonschema) は残る。
      - name: Export locked requirements (all extras, all groups)
        run: uv export --frozen --all-extras --all-groups --no-emit-project --no-emit-local --no-hashes -o "$RUNNER_TEMP/audit-requirements.txt"

      - name: pip-audit
        run: uv run --no-sync pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"
