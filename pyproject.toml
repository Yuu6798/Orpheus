[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orpheus-mv-pipeline"
version = "0.1.0"
description = "Reproducible local music video pipeline"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema==4.26.0", "Pillow==12.1.1", "numpy==2.3.5", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
analysis = ["librosa==0.11.0", "numba==0.63.1", "llvmlite==0.46.0"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[project.scripts]
mv = "mv_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mv_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
