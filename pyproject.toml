[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "orpheus-mv-pipeline"
version = "0.1.0"
description = "Reproducible local music video pipeline"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema==4.26.0", "Pillow==13.0.0", "numpy==2.3.5", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
analysis = ["librosa==0.11.0", "numba==0.63.1", "llvmlite==0.46.0"]
fx = ["opencv-python-headless==5.0.0.93"]
# 自作の 3D モデリングツール（tools/model3d。Orpheus とはファイルと記録で接続する外部ツール。docs/model3d.md）
model3d = ["orpheus-model3d==0.1.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]
audit = ["pip-audit==2.10.1"]

[project.scripts]
mv = "mv_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mv_pipeline"]

[tool.pytest.ini_options]
# tools/model3d のテストは model3d extra が無いと skip される（conftest の importorskip）。CI は --extra model3d で同期する。
testpaths = ["tests", "tools/model3d/tests"]

[tool.uv]
# uv < 0.13.4 は emSign ECC Root CA - G3 を含む CA bundle を同梱する (GHSA-hq85-5cpj-mr62)。
# 古い uv で lock や sync を回さないよう、ローカル実行でも強制する。
required-version = ">=0.13.5"

[tool.uv.sources]
# tools/model3d はパス依存（editable）。workspace member にすると `uv sync --extra analysis …` が member にも extra を求めて止まる。
orpheus-model3d = { path = "tools/model3d", editable = true }
